name: Build tagged release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("node:fs");
            const tag = process.env.RELEASE_TAG;
            const version = tag.replace(/^v/, "");
            const packageVersion = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            const themeVersion = JSON.parse(fs.readFileSync("komari-theme.json", "utf8")).version;
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$/.test(tag)) {
              throw new Error(`Tag ${tag} must use the v1.2.3 format`);
            }
            if (version !== packageVersion || version !== themeVersion) {
              throw new Error(`Version mismatch: tag=${version}, package=${packageVersion}, theme=${themeVersion}`);
            }
          '

      - name: Build theme
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: komari-theme-glass-${{ github.ref_name }}
          path: komari-theme-glass-${{ github.ref_name }}-*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: komari-theme-glass-${{ github.ref_name }}-*.zip
